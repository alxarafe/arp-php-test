services:
  db:
    image: mariadb:12.3
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-arp_php_test}
      MARIADB_USER: ${DB_USER:-arp}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/init.sh:/docker-entrypoint-initdb.d/10-create-test-db.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    working_dir: /app
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    command: >-
      sh -c 'composer install --no-interaction --prefer-dist &&
      php bin/console app:init &&
      php -S 0.0.0.0:8080 -t public'
volumes:
  db_data:
